# =============================================================================
# File        : charts/tasktracker/templates/frontend-nginx-configmap.yaml
# Assignment  : DSO202 Assignment 4 (from Assignment 1, frontend/nginx-configmap.yaml)
# Purpose     : Same-origin API proxy for the frontend. The frontend image bakes
#               BACKEND_URL ("/backend") into config.js, which runs in the BROWSER
#               and cannot resolve cluster DNS. nginx inside the Pod proxies
#               /backend/* to backend-svc, so the page works over NodePort 30080 and
#               over kubectl port-forward with no ingress controller (none is
#               installed in this assignment) and keeps backend-svc ClusterIP-only.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app: task-tracker
    tier: frontend
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      sendfile on;
      keepalive_timeout 65;

      server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /config.js {
          add_header Cache-Control "no-store";
        }

        # --- the fix -------------------------------------------------------
        # BACKEND_URL is "/backend", so app.js calls /backend/api/tasks and
        # /backend/api/status. The trailing slash on proxy_pass strips the
        # /backend prefix, so backend-svc receives /api/tasks and /api/status
        # unchanged. `backend-svc` resolves here because nginx runs inside the
        # cluster and does use CoreDNS.
        location /backend/ {
          proxy_pass http://backend-svc:8080/;
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        # -------------------------------------------------------------------

        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }

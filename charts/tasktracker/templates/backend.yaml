# File: charts/tasktracker/templates/backend.yaml (DSO202 Assignment 4)
# Backend Deployment and Service. Sync wave "1": after the database is Healthy (C5).
# progressDeadlineSeconds: 120 so that a faulty release is reported Degraded
# after two minutes instead of the Kubernetes default of ten (C6).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app: task-tracker
    tier: backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.backend.replicaCount }}
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: task-tracker
      tier: backend
  template:
    metadata:
      labels:
        {{- include "task-tracker.labels" . | nindent 8 }}
        app: task-tracker
        tier: backend
        version: v1
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: {{ include "task-tracker.image" .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: task-tracker-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-tracker.secretName" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-tracker.secretName" . }}
                  key: DB_PASSWORD
            {{- range $name, $value := .Values.backend.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # TCP, not /api/status: a database outage must not restart the API (Assignment 2)
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app: task-tracker
    tier: backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app: task-tracker
    tier: backend
  ports:
    - name: http
      port: 8080
      targetPort: http

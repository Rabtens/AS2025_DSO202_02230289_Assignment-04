# File: charts/tasktracker/templates/serviceaccounts.yaml (DSO202 Assignment 4)
# One ServiceAccount per tier, used by the Pods below. Roles and RoleBindings
# are NOT rendered here: they belong to the platform layer (C8).
{{- range $sa := list "backend-sa" "frontend-sa" "db-sa" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    {{- include "task-tracker.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}

# File: charts/tasktracker/templates/frontend.yaml (DSO202 Assignment 4)
# Frontend Deployment and NodePort Service. Sync wave "2": last, after the
# backend is Healthy (C5). The NodePort number is a value (C10).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app: task-tracker
    tier: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  progressDeadlineSeconds: 120
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: task-tracker
      tier: frontend
  template:
    metadata:
      labels:
        {{- include "task-tracker.labels" . | nindent 8 }}
        app: task-tracker
        tier: frontend
        version: v1
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/nginx: {{ include (print $.Template.BasePath "/frontend-nginx-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: frontend-sa
      containers:
        - name: frontend
          image: {{ include "task-tracker.image" .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: task-tracker-config
                  key: BACKEND_URL
            {{- range $name, $value := .Values.frontend.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            # Replaces the image's nginx.conf with the one that proxies /backend/*
            # to backend-svc (see frontend-nginx-configmap.yaml). subPath swaps one
            # file instead of masking the whole /etc/nginx directory.
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    app: task-tracker
    tier: frontend
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: NodePort
  selector:
    app: task-tracker
    tier: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: {{ .Values.frontend.service.nodePort }}

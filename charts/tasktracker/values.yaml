# =============================================================================
# File        : charts/tasktracker/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - values; Unit IV 4.3.1 - per-environment values
# Purpose     : Chart DEFAULTS only. environments/<env>/values.yaml holds
#               everything that differs between dev and staging.
# =============================================================================

# Environment name (dev | staging). Required: the chart refuses to render
# without it (C-contract: environments differ only in values).
environment: ""

# Name of an EXISTING Secret holding DB_USER, DB_PASSWORD, POSTGRES_USER and
# POSTGRES_PASSWORD. The chart never renders a Secret (C3); the platform layer
# creates this one from a SealedSecret.
existingSecret: ""

# Public host name, used only for CORS_ORIGIN in the ConfigMap (as in Assignment 2).
host: tasktracker.local

# Shared application configuration (ConfigMap task-tracker-config).
config:
  dbHost: db-0.db-headless
  dbPort: "5432"
  dbName: taskdb
  appPort: "8080"
  backendUrl: /backend

# Tag values are quoted so that YAML keeps them as strings ("1.0", not 1.0).
database:
  image:
    repository: sarojsanyasi/dso202-db
    tag: "1.0"
  storage: 1Gi
  storageClassName: standard
  partition: 0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

backend:
  replicaCount: 1
  image:
    repository: sarojsanyasi/dso202-backend
    tag: "1.0"
    pullPolicy: IfNotPresent
  # Extra environment variables for the backend container, as NAME: value.
  # Adding a variable is a values change only (C2); no template is edited.
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    repository: sarojsanyasi/dso202-frontend
    tag: "1.0"
    pullPolicy: IfNotPresent
  # Extra environment variables for the frontend container, as NAME: value.
  env: {}
  service:
    # NodePort number, set per environment (30080 dev, 30081 staging; C10).
    nodePort: 30080
  resources:
    requests:
      cpu: 20m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# No ingress controller is installed in this assignment (C9): disabled.
ingress:
  enabled: false
  className: nginx
  tlsSecretName: tasktracker-tls
